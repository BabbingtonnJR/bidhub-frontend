# Testes e build; na main, publica o site (Shell + MFs) no Azure Static Web Apps.
# Variáveis do repositório (Settings > Secrets and variables > Actions):
#   secrets.AZURE_STATIC_WEB_APPS_API_TOKEN  token de implantação do Static Web App
#   vars.VITE_API_URL                        URL do API Gateway, ex.: https://bidhub-apim.azure-api.net/api
#   secrets.VITE_API_KEY                     chave de assinatura do APIM
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      TEM_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build da Shell e dos dois microfrontends em um único site
        run: npm run build:site
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.TEM_TOKEN == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist-site
          skip_app_build: true
